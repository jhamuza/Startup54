<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Startup54 CMS</title>
  <link rel="stylesheet" href="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.css" />
</head>
<body>
  <div id="nc-root"></div>
  <script src="config.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Wait for Decap CMS to load, then initialize with config
    window.addEventListener('load', () => {
      setTimeout(() => {
        if (window.CMS && window.CMS_CONFIG) {
          try {
            window.CMS.init({ config: window.CMS_CONFIG });
          } catch (e) {
            console.error('Error initializing CMS:', e);
          }
        }
      }, 100);
    });
  </script>
</body>
</html>
