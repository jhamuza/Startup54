backend:
  name: github
  repo: jhamuza/Startup54
  branch: main
  base_url: https://startup54.com
  auth_endpoint: /api/auth

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: events
    label: Events
    files:
      - name: events
        label: All Events
        file: public/_content/events.json
        fields:
          - label: Events
            name: events
            widget: list
            fields:
              - label: City
                name: city
                widget: string
              - label: Region
                name: region
                widget: string
              - label: Status
                name: status
                widget: select
                options: [past, live, soon]
              - label: Dates
                name: dates
                widget: string
              - label: Venue
                name: venue
                widget: string
              - label: Blurb
                name: blurb
                widget: text
              - label: Latitude
                name: lat
                widget: number
              - label: Longitude
                name: lng
                widget: number

  - name: pastEvents
    label: Past Events
    files:
      - name: pastEvents
        label: All Past Events
        file: public/_content/past-events.json
        fields:
          - label: Past Events
            name: pastEvents
            widget: list
            fields:
              - label: Event ID
                name: id
                widget: string
                hint: "Unique identifier (e.g., kuching-2025)"
              - label: Title
                name: title
                widget: string
              - label: Venue
                name: venue
                widget: string
              - label: Location
                name: location
                widget: string
              - label: Story
                name: story
                widget: text
              - label: Media
                name: images
                widget: list
                fields:
                  - label: Type
                    name: type
                    widget: select
                    options: [image, video]
                  - label: URL
                    name: url
                    widget: string

  - name: hero
    label: Hero Section
    files:
      - name: hero
        label: Hero Content
        file: public/_content/hero.json
        fields:
          - label: Headline
            name: headline
            widget: string
          - label: Subheadline
            name: subheadline
            widget: text
          - label: CTA Button Text
            name: ctaText
            widget: string
          - label: CTA Button URL
            name: ctaUrl
            widget: string
          - label: Upcoming City
            name: upcomingCity
            widget: string
          - label: Dates
            name: dates
            widget: string
          - label: Venue
            name: venue
            widget: string
          - label: Target Countdown Date
            name: countdownTarget
            widget: string

  - name: journey
    label: 3-Day Journey
    files:
      - name: journey
        label: Journey Schedule
        file: public/_content/journey.json
        fields:
          - label: Days
            name: days
            widget: list
            fields:
              - label: Day Number
                name: n
                widget: string
              - label: Day Name
                name: day
                widget: string
              - label: Title
                name: title
                widget: string
              - label: Tone
                name: tone
                widget: select
                options: [mint, gold, coral]
              - label: Icon
                name: icon
                widget: string
              - label: Bullets
                name: bullets
                widget: list
                fields:
                  - label: Time
                    name: time
                    widget: string
                  - label: Activity
                    name: what
                    widget: string

  - name: why
    label: Why Participate
    files:
      - name: why
        label: Value Propositions
        file: public/_content/why.json
        fields:
          - label: Propositions
            name: why
            widget: list
            fields:
              - label: Icon
                name: icon
                widget: string
              - label: Tone
                name: tone
                widget: select
                options: [coral, mint, gold, lavender]
              - label: Title
                name: title
                widget: string
              - label: Description
                name: body
                widget: text

  - name: supporters
    label: Supporters
    files:
      - name: supporters
        label: Supporter Logos
        file: public/_content/supporters.json
        fields:
          - label: Supporters
            name: supporters
            widget: list
            fields:
              - label: Name
                name: name
                widget: string
              - label: Logo URL
                name: src
                widget: string
              - label: Background
                name: bg
                widget: select
                options: [white, ink]

  - name: cta
    label: CTA Section
    files:
      - name: cta
        label: Call to Action
        file: public/_content/cta.json
        fields:
          - label: Headline
            name: headline
            widget: string
          - label: Description
            name: description
            widget: text
          - label: Button Text
            name: buttonText
            widget: string
          - label: Button URL
            name: buttonUrl
            widget: string
